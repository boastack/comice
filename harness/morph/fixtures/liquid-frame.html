<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurable Liquid Frame Morph</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }

    .hero-text {
      height: 55vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
    }

    .hero-text h1 {
      font-size: 2.75rem;
      color: #0f172a;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .hero-text p {
      font-size: 1.125rem;
      color: #64748b;
      max-width: 580px;
    }

    .scroll-section {
      height: 260vh;
      position: relative;
    }

    .sticky-wrapper {
      position: sticky;
      top: 50%;
      transform: translateY(-50%);
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .canvas-container {
      width: 1224px;
      height: 688px;
      max-width: 95vw;
      position: relative;
      will-change: transform;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #hero-video {
      display: none;
    }

    .footer-space {
      height: 100vh;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <section class="hero-text">
    <h1>One platform, every academic workflow</h1>
    <p>Scroll down to interact with the configurable viewport transition.</p>
  </section>

  <div class="scroll-section" id="scrollTriggerArea">
    <div class="sticky-wrapper">
      <div class="canvas-container" id="canvasWrapper">
        <canvas id="liquidCanvas"></canvas>
      </div>
    </div>
  </div>

  <div class="footer-space"></div>

  <video
    id="hero-video"
    preload="auto"
    playsinline
    webkit-playsinline
    muted
    loop
    autoplay>
  </video>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <script>
    // =========================================================================
    // MASTER CONFIGURATION PANEL
    // =========================================================================
    const CONFIG = {
      // 1. Media Type & Source
      mediaType: 'video',          // 'video' | 'image'
      mediaUrl:  'video.mp4',       // File path or URL (e.g. 'video.mp4' or 'image.jpg')

      // 2. Motion Direction
      direction: 'split-to-full',   // 'split-to-full' | 'full-to-split'

      // 3. Feature Switches (true = ON | false = OFF)
      enableScale:        true,    // Container scale zoom on scroll
      enableBend:         true,    // Scroll velocity elastic inertia bend
      enableLiquid:       true,    // Organic liquid metaball bridge & sheen
      enableCursorFollow: true,    // Internal media parallax camera shift

      // 4. Custom Tuning Metrics
      startScale: 0.90,            // Scale value for 3-card state
      endScale:   1.00             // Scale value for single frame state
    };
    // =========================================================================

    gsap.registerPlugin(ScrollTrigger);

    const video = document.getElementById('hero-video');
    const container = document.getElementById('canvasWrapper');
    const canvas = document.getElementById('liquidCanvas');

    const isHoverSupported = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let rawScrollVelocity = 0;

    // Mouse Tracking
    const mouse = { targetX: 0, targetY: 0, currentX: 0, currentY: 0 };
    if (CONFIG.enableCursorFollow && isHoverSupported && !prefersReducedMotion) {
      window.addEventListener('mousemove', (e) => {
        mouse.targetX = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.targetY = -(e.clientY / window.innerHeight) * 2 + 1;
      });
    }

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

    // Texture Loader Strategy (Video vs Image)
    let texture;
    if (CONFIG.mediaType === 'image') {
      texture = new THREE.TextureLoader().load(CONFIG.mediaUrl);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
    } else {
      video.src = CONFIG.mediaUrl;
      video.play().catch(() => {
        document.addEventListener('click', () => video.play(), { once: true });
      });
      texture = new THREE.VideoTexture(video);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
    }

    // Dynamic Shader Construction
    const fragmentShader = `
      uniform vec2 u_resolution;
      uniform float u_progress;
      uniform vec2 u_mouse;
      uniform float u_velocity;
      uniform sampler2D u_media;

      varying vec2 vUv;

      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      float sdRoundedBox(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + vec2(r);
        return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
      }

      void main() {
        float aspect = u_resolution.x / u_resolution.y;
        vec2 st = (vUv - 0.5) * vec2(aspect, 1.0);

        // Velocity Bend Toggle
        ${CONFIG.enableBend ? `
          float arch = sin(vUv.x * 3.14159265);
          st.y += arch * u_velocity * 0.04;

          float pinch = cos(st.y * 3.14159265 * 2.0);
          st.x += pinch * u_velocity * 0.02;
        ` : ''}

        float p = clamp(u_progress, 0.0, 1.0);

        float pRope   = smoothstep(0.0, 0.15, p);
        float pMerge  = smoothstep(0.10, 0.90, p);
        float pFinal  = smoothstep(0.85, 1.0, p);

        // Frame Metrics
        float cardW_start = 396.0 / 688.0;
        float gap_start   = 16.0 / 688.0;
        float totalW      = 1224.0 / 688.0;

        float gap   = mix(gap_start, 0.0, pMerge);
        float cardW = mix(cardW_start, totalW / 3.0, pMerge);

        float c1_x = -(cardW + gap);
        float c3_x =  (cardW + gap);

        float rCard = mix(24.0 / 688.0, 32.0 / 688.0, pMerge);

        // Card SDFs
        float d1 = sdRoundedBox(st - vec2(c1_x, 0.0), vec2(cardW * 0.5, 0.5), rCard);
        float d2 = sdRoundedBox(st - vec2(0.0,  0.0), vec2(cardW * 0.5, 0.5), rCard);
        float d3 = sdRoundedBox(st - vec2(c3_x, 0.0), vec2(cardW * 0.5, 0.5), rCard);
        float dCards = min(d1, min(d2, d3));

        // Liquid Toggle Calculations
        float dResult;
        float liquidSheen = 0.0;

        ${CONFIG.enableLiquid ? `
          vec2 bridge1Center = vec2((c1_x + 0.0) * 0.5, 0.0);
          vec2 bridge2Center = vec2((0.0 + c3_x) * 0.5, 0.0);

          float rDrop = mix(6.0 / 688.0, 0.55, pMerge) * pRope;
          float dDrop1 = length(st - bridge1Center) - rDrop;
          float dDrop2 = length(st - bridge2Center) - rDrop;
          float dDrops = min(dDrop1, dDrop2);

          float gooeyK = mix(0.09, 0.002, pow(pMerge, 2.0)) * pRope + 0.001;
          float dLiquid = smin(dCards, dDrops, gooeyK);

          float dFinalBox = sdRoundedBox(st, vec2(totalW * 0.5, 0.5), 32.0 / 688.0);
          dResult = mix(dLiquid, dFinalBox, pFinal);

          liquidSheen = smoothstep(0.012, 0.0, abs(dResult)) * pRope * (1.0 - pFinal) * 0.45;
        ` : `
          float dFinalBox = sdRoundedBox(st, vec2(totalW * 0.5, 0.5), 32.0 / 688.0);
          dResult = mix(dCards, dFinalBox, pMerge);
        `}

        // Mask Edge Cutoff
        float alpha = smoothstep(0.0015, -0.0015, dResult);

        // Cursor Follow Toggle
        ${CONFIG.enableCursorFollow ? `
          vec2 mediaOffset = u_mouse * 0.035;
          vec2 centeredUv = (vUv - 0.5) * 0.95 + 0.5;
          vec2 parallaxUV = centeredUv - mediaOffset;
        ` : `
          vec2 parallaxUV = vUv;
        `}

        vec4 mediaColor = texture2D(u_media, clamp(parallaxUV, 0.0, 1.0));
        vec3 finalColor = mediaColor.rgb + vec3(1.0, 1.0, 1.0) * liquidSheen;

        gl_FragColor = vec4(finalColor, mediaColor.a * alpha);
      }
    `;

    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const material = new THREE.ShaderMaterial({
      vertexShader,
      fragmentShader,
      transparent: true,
      uniforms: {
        u_resolution: { value: new THREE.Vector2() },
        u_progress:   { value: 0.0 },
        u_mouse:      { value: new THREE.Vector2(0, 0) },
        u_velocity:   { value: 0.0 },
        u_media:      { value: texture }
      }
    });

    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
    scene.add(mesh);

    // Resize Observer
    const resizeObserver = new ResizeObserver(() => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      if (w > 0 && h > 0) {
        renderer.setSize(w, h);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        material.uniforms.u_resolution.value.set(w, h);
      }
    });
    resizeObserver.observe(container);

    // GPU Visibility Guard
    let isVisible = true;
    const visibilityObserver = new IntersectionObserver(([entry]) => {
      isVisible = entry.isIntersecting;
    }, { threshold: 0.05 });
    visibilityObserver.observe(document.getElementById('scrollTriggerArea'));

    let smoothVelocity = 0;

    // Render Loop
    function render() {
      requestAnimationFrame(render);
      if (!isVisible) return;

      if (CONFIG.enableBend && !prefersReducedMotion) {
        const targetVel = Math.max(-1.0, Math.min(1.0, rawScrollVelocity / 2000));
        smoothVelocity += (targetVel - smoothVelocity) * 0.08;
        material.uniforms.u_velocity.value = smoothVelocity;
        rawScrollVelocity *= 0.9;
      }

      if (CONFIG.enableCursorFollow && isHoverSupported && !prefersReducedMotion) {
        mouse.currentX += (mouse.targetX - mouse.currentX) * 0.05;
        mouse.currentY += (mouse.targetY - mouse.currentY) * 0.05;
        material.uniforms.u_mouse.value.set(mouse.currentX, mouse.currentY);
      }

      const currentScale = container.dataset.scale || 1.0;
      container.style.transform = `scale(${currentScale})`;

      if (CONFIG.mediaType === 'video' && video.readyState >= video.HAVE_CURRENT_DATA) {
        texture.needsUpdate = true;
      }
      renderer.render(scene, camera);
    }
    render();

    // Motion Direction & Scale Pipeline
    const isFullToSplit = CONFIG.direction === 'full-to-split';

    const pStart = isFullToSplit ? 1.0 : 0.0;
    const pEnd   = isFullToSplit ? 0.0 : 1.0;

    const sStart = CONFIG.enableScale ? (isFullToSplit ? CONFIG.endScale : CONFIG.startScale) : 1.0;
    const sEnd   = CONFIG.enableScale ? (isFullToSplit ? CONFIG.startScale : CONFIG.endScale) : 1.0;

    material.uniforms.u_progress.value = prefersReducedMotion ? pEnd : pStart;
    container.dataset.scale = prefersReducedMotion ? 1.0 : sStart;

    if (!prefersReducedMotion) {
      const tl = gsap.timeline({
        scrollTrigger: {
          trigger: "#scrollTriggerArea",
          start: "top top",
          end: "bottom bottom",
          scrub: 0.3,
          onUpdate: (self) => {
            if (CONFIG.enableBend) {
              rawScrollVelocity = self.getVelocity();
            }
          }
        }
      });

      // Scale Animation
      tl.to(container, {
        onUpdate: function() {
          const progress = this.progress();
          container.dataset.scale = sStart + (sEnd - sStart) * progress;
        },
        duration: 1,
        ease: "power1.out"
      }, 0);

      // Shader Morph Progress
      tl.to(material.uniforms.u_progress, {
        value: pEnd,
        ease: "power1.inOut",
        duration: 1
      }, 0);
    }
  </script>
</body>
</html>
