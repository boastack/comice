<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Morph · Fast scroll check</title>
<link rel="stylesheet" href="/demo/morph/fonts.css">
<style>
:root{color-scheme:dark;font:14px Geist,system-ui,sans-serif;background:#0c0c0c;color:#eee}*{box-sizing:border-box}body{margin:0}header{max-width:1100px;margin:auto;padding:22px 24px 16px}h1{font-size:24px;letter-spacing:-.04em;font-weight:500;margin:0 0 6px}p{color:#aaa;margin:0 0 16px;font-size:13px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}label{display:flex;align-items:center;gap:8px;color:#aaa;font-size:12px}select,button{font:inherit;border:1px solid #383838;border-radius:7px;padding:9px 12px;background:#1b1b1b;color:#eee}button{background:#00c65c;border-color:#00c65c;color:#071b0d;font-weight:600;cursor:pointer}select:focus-visible,button:focus-visible{outline:2px solid #00c65c;outline-offset:3px}button:disabled{opacity:.5;cursor:wait}output{font-size:12px;color:#aaa}iframe{display:block;width:min(1100px,100%);height:calc(100svh - 170px);min-height:400px;margin:0 auto;border:1px solid #292929;border-radius:12px;background:#0c0c0c}a{color:#aaa;font-size:12px}footer{max-width:1100px;margin:12px auto;padding:0 24px}@media(max-width:600px){header{padding:16px}iframe{border-radius:0;height:calc(100svh - 230px)}h1{font-size:21px}}
</style>
</head>
<body>
<header>
<h1>Fast scroll · corner and top-edge check</h1>
<p>Rapidly reverse the actual showcase's scroll. Watch all four corners and the top as the shape approaches its frame.</p>
<div class="controls">
<label>Demo <select id="scene" aria-label="Demo"><option value="hero-merge">Hero Merge</option><option value="circles">Circle Breakout</option><option value="arches">Arches</option><option value="deck">Card Deck</option><option value="petals">Petals</option><option value="apple">Apple Contour</option></select></label>
<label>Speed <select id="speed" aria-label="Speed"><option value="700">Normal</option><option value="350" selected>Fast</option><option value="180">Very fast</option></select></label>
<button id="run" disabled>Replay rapid scroll</button><output id="status" aria-live="polite">Loading showcase…</output>
</div>
</header>
<iframe id="demo" src="/demo/morph/" title="Live morph showcase under scroll stress"></iframe>
<footer><a href="/demo/morph/">Open the full showcase</a> · The replay stops after eight seconds. You can also scroll inside the demo yourself.</footer>
<script type="module">
const frame = document.querySelector('#demo'), scene = document.querySelector('#scene'), speed = document.querySelector('#speed'), button = document.querySelector('#run'), status = document.querySelector('#status')
let raf = 0, generation = 0, running = false
function stop(message = 'Stopped') {
  cancelAnimationFrame(raf); raf = 0; running = false
  button.textContent = 'Replay rapid scroll'; status.textContent = message
}
async function selectScene() {
  stop(); const token = ++generation
  const win = frame.contentWindow
  button.disabled = true; status.textContent = 'Preparing scene…'
  try {
    const deadline = performance.now() + 15000
    let entry
    while (performance.now() < deadline) {
      if (token !== generation) return
      entry = win.__demos?.find(entry => entry.id === scene.value)
      if (entry) {
        win.scrollTo(0, entry.section.offsetTop + (entry.section.offsetHeight - win.innerHeight) * .5)
        if (entry.live) break
        if (entry.failed) throw Error('This scene could not load. Check the full showcase.')
      }
      await new Promise(resolve => setTimeout(resolve, 50))
    }
    if (!entry?.live) throw Error('Scene preparation timed out. Reload to retry.')
    if (token !== generation) return
    button.disabled = false; status.textContent = 'Ready · inspect the corners while replaying'
  } catch (error) { if (token === generation) status.textContent = error.message }
}
function run() {
  if (running) { stop(); return }
  const win = frame.contentWindow, entry = win.__demos.find(entry => entry.id === scene.value)
  const top = entry.section.offsetTop, range = entry.section.offsetHeight - win.innerHeight
  const pass = Number(speed.value), started = performance.now()
  running = true; button.textContent = 'Stop replay'; status.textContent = 'Reversing rapidly · watching corners and top'
  const tick = now => {
    if (now - started >= 8000) { stop('Complete · replay or try another speed'); return }
    // Native scroll events feed the unmodified showcase driver and bend input.
    const cycle = (now - started) / pass, fraction = cycle % 2
    const progress = fraction <= 1 ? fraction : 2 - fraction
    win.scrollTo(0, top + range * (.005 + progress * .99))
    raf = requestAnimationFrame(tick)
  }
  raf = requestAnimationFrame(tick)
}
frame.addEventListener('load', selectScene)
scene.addEventListener('change', selectScene)
speed.addEventListener('change', () => stop('Speed changed · replay to inspect'))
button.addEventListener('click', run)
document.addEventListener('visibilitychange', () => { if (document.hidden) stop('Paused while hidden') })
addEventListener('pagehide', () => { generation++; stop() })
</script>
</body>
</html>
