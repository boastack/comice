<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0c0c">
  <meta name="description" content="African objects and symbols transformed through liquid motion, shape and scroll.">
  <title>Comice Morph</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Familjen+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/soundtrack.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      color-scheme: dark;
      font-family: "Familjen Grotesk", sans-serif;
      background: #0c0c0c;
    }

    body {
      min-height: 100svh;
      overflow-x: hidden;
      color: #f4f4f4;
      background-color: #0c0c0c;
      background-image: radial-gradient(circle, rgba(255,255,255,.14) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    button { font: inherit; }

    .intro {
      position: relative;
      height: 125svh;
    }

    .intro-stage {
      position: sticky;
      top: 0;
      display: grid;
      min-height: 100svh;
      place-items: center;
      padding: 48px 24px;
      overflow: hidden;
    }

    .intro-content {
      width: min(900px, 100%);
      text-align: center;
      will-change: transform, opacity;
    }

    .eyebrow,
    .shape-number,
    .shape-note,
    .scroll-cue {
      font-family: "IBM Plex Mono", monospace;
      text-transform: uppercase;
      letter-spacing: .11em;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: #868686;
      font-size: 10px;
    }

    .eyebrow::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00c65c;
      box-shadow: 0 0 18px rgba(0,198,92,.7);
      content: "";
    }

    h1 {
      font-size: clamp(52px, 7.4vw, 104px);
      font-weight: 600;
      line-height: .94;
      letter-spacing: -.055em;
    }

    .intro-description {
      width: min(580px, 100%);
      margin: 26px auto 0;
      color: #8a8a8a;
      font-family: "DM Sans", sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    .scroll-cue {
      position: absolute;
      bottom: 28px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #717171;
      font-size: 9px;
      transform: translateX(-50%);
    }

    .scroll-cue svg { width: 15px; stroke: #00c65c; }

    .shape-section {
      position: relative;
      height: 180svh;
    }

    .shape-stage {
      position: sticky;
      top: 0;
      display: grid;
      min-height: 100svh;
      place-items: center;
      padding: 94px 20px 28px;
      overflow: hidden;
    }

    .shape-copy {
      position: absolute;
      top: 42px;
      left: 50%;
      width: min(520px, calc(100vw - 40px));
      text-align: center;
      transform: translateX(-50%);
      pointer-events: none;
    }

    .shape-copy h2 {
      margin-top: 5px;
      font-size: 48px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -.035em;
    }

    .shape-number,
    .shape-note {
      color: #686868;
    }

    .shape-number { font-size: 9px; }
    .shape-note {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.45;
    }

    .frame {
      position: relative;
      width: min(512px, calc(100vw - 40px), 72svh);
      aspect-ratio: 1;
      will-change: transform;
    }

    canvas { display: block; width: 100%; height: 100%; }
    video { display: none; }

    @media (max-width: 600px) {
      .intro { height: 118svh; }
      .intro-stage { padding-inline: 22px; }
      h1 { font-size: clamp(44px, 14vw, 62px); }
      .intro-description { font-size: 14px; }
      .shape-section { height: 165svh; }
      .shape-stage { padding-top: 86px; }
      .shape-copy { top: 36px; }
      .shape-copy h2 { font-size: 28px; }
      .frame { width: min(512px, calc(100vw - 28px), 68svh); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-cue { display: none; }
    }
  </style>
</head>
<body>
  <section class="intro" id="intro">
    <div class="intro-stage">
      <div class="intro-content">
        <p class="eyebrow">African collection · 16 forms + signature</p>
        <h1>Comice Morph</h1>
        <p class="intro-description">Africa objects and symbols transformed through motion, shape and scroll</p>
      </div>
      <div class="scroll-cue" aria-hidden="true">
        <span>Scroll to shape</span>
        <svg viewBox="0 0 16 16"><path d="M8 2v11M4.5 9.5 8 13l3.5-3.5"/></svg>
      </div>
    </div>
  </section>

  <main id="collection"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="assets/libs/african.js"></script>
  <script src="assets/libs/soundtrack.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    const SHAPES = [
      ['a', 'Africa', 'The continent'],
      ['b', 'Warrior', 'People and heritage'],
      ['c', 'Zebra', 'Wildlife'],
      ['d', 'Vessel', 'Craft and form'],
      ['e', 'Savanna', 'Land and horizon'],
      ['f', 'Giraffe', 'Wildlife'],
      ['g', 'Spear Dance', 'Movement and ritual'],
      ['h', 'Ancestral Mask', 'Symbol and identity'],
      ['i', 'Djembe', 'Rhythm and sound'],
      ['j', 'Crowned Profile', 'Portrait and identity'],
      ['k', 'Lion', 'Strength'],
      ['l', 'Ceremonial Dress', 'People and heritage'],
      ['m', 'Leopard', 'Wildlife'],
      ['n', 'Sun Mask', 'Symbol and identity'],
      ['o', 'Water Bearer', 'Daily life'],
      ['p', 'Safari', 'Travel and landscape'],
      ['signature', '@walebuilds_', 'Olawale Balo']
    ];

    const collection = document.getElementById('collection');
    collection.innerHTML = SHAPES.map(([key, title, note], index) => `
      <section class="shape-section" id="shape-${key}">
        <div class="shape-stage">
          <header class="shape-copy">
            <p class="shape-number">${String(index + 1).padStart(2, '0')} / ${SHAPES.length}</p>
            <h2>${title}</h2>
            <p class="shape-note">${note}</p>
          </header>
          <div class="frame" id="frame-${key}"><canvas id="canvas-${key}"></canvas></div>
        </div>
      </section>
    `).join('');

    const sharedVideo = document.createElement('video');
    sharedVideo.muted = true;
    sharedVideo.loop = true;
    sharedVideo.playsInline = true;
    sharedVideo.preload = 'auto';
    sharedVideo.src = 'assets/video/canvas.mp4';
    sharedVideo.setAttribute('aria-hidden', 'true');
    sharedVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;inset:auto 0 0 auto;';
    document.body.appendChild(sharedVideo);
    sharedVideo.load();
    const sharedVideoTexture = new THREE.VideoTexture(sharedVideo);
    sharedVideoTexture.minFilter = THREE.LinearFilter;
    sharedVideoTexture.magFilter = THREE.LinearFilter;
    const visibleDemos = new Set();

    function syncSharedVideoPlayback() {
      if (visibleDemos.size && !document.hidden) sharedVideo.play().catch(() => {});
      else sharedVideo.pause();
    }

    const prefersReducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const supportsHover = matchMedia('(hover: hover) and (pointer: fine)').matches;
    function distanceTransform(inside, size, target) {
      const distances = new Float32Array(size * size);
      const infinity = 1e6;
      const diagonal = Math.SQRT2;
      for (let index = 0; index < distances.length; index += 1) {
        distances[index] = inside[index] === target ? 0 : infinity;
      }
      for (let y = 0; y < size; y += 1) {
        for (let x = 0; x < size; x += 1) {
          const index = y * size + x;
          let value = distances[index];
          if (x) value = Math.min(value, distances[index - 1] + 1);
          if (y) value = Math.min(value, distances[index - size] + 1);
          if (x && y) value = Math.min(value, distances[index - size - 1] + diagonal);
          if (x + 1 < size && y) value = Math.min(value, distances[index - size + 1] + diagonal);
          distances[index] = value;
        }
      }
      for (let y = size - 1; y >= 0; y -= 1) {
        for (let x = size - 1; x >= 0; x -= 1) {
          const index = y * size + x;
          let value = distances[index];
          if (x + 1 < size) value = Math.min(value, distances[index + 1] + 1);
          if (y + 1 < size) value = Math.min(value, distances[index + size] + 1);
          if (x + 1 < size && y + 1 < size) value = Math.min(value, distances[index + size + 1] + diagonal);
          if (x && y + 1 < size) value = Math.min(value, distances[index + size - 1] + diagonal);
          distances[index] = value;
        }
      }
      return distances;
    }

    const sdfJobs = [];
    let sdfJobRunning = false;

    function runNextSdfJob() {
      if (sdfJobRunning || !sdfJobs.length) return;
      sdfJobRunning = true;
      requestAnimationFrame(() => {
        const job = sdfJobs.shift();
        try {
          job();
        } catch (error) {
          console.error('Unable to build African shape mask', error);
        } finally {
          sdfJobRunning = false;
          if (sdfJobs.length) setTimeout(runNextSdfJob, 0);
        }
      });
    }

    function enqueueSdfJob(job) {
      sdfJobs.push(job);
      runNextSdfJob();
    }

    function createSdfTexture(url) {
      const size = 1024;
      const maxDistance = 192;
      const pixels = new Uint8Array(size * size * 4);
      pixels.fill(255);
      const texture = new THREE.DataTexture(pixels, size, size, THREE.RGBAFormat);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = false;
      texture.flipY = true;
      texture.needsUpdate = true;

      const image = new Image();
      image.onload = () => {
        enqueueSdfJob(() => {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const context = canvas.getContext('2d', { willReadFrequently: true });
          const aspect = image.naturalWidth / image.naturalHeight;
          const maxSize = size * .82;
          const width = aspect >= 1 ? maxSize : maxSize * aspect;
          const height = aspect >= 1 ? maxSize / aspect : maxSize;
          context.drawImage(image, (size - width) / 2, (size - height) / 2, width, height);
          const rgba = context.getImageData(0, 0, size, size).data;
          const inside = new Uint8Array(size * size);
          for (let index = 0; index < inside.length; index += 1) {
            inside[index] = rgba[index * 4 + 3] > 96 ? 1 : 0;
          }
          const toInside = distanceTransform(inside, size, 1);
          const toOutside = distanceTransform(inside, size, 0);
          for (let index = 0; index < inside.length; index += 1) {
            const signed = inside[index] ? -toOutside[index] : toInside[index];
            const encoded = Math.round((Math.max(-maxDistance, Math.min(maxDistance, signed)) / maxDistance * .5 + .5) * 255);
            const pixel = index * 4;
            pixels[pixel] = encoded;
            pixels[pixel + 1] = encoded;
            pixels[pixel + 2] = encoded;
            pixels[pixel + 3] = 255;
          }
          texture.needsUpdate = true;
        });
      };
      const shapeKey = url.split('/').pop().replace('.svg', '');
      image.src = window.AFRICAN_SHAPE_URLS?.[shapeKey] || url;
      return texture;
    }

    function createWordmarkSdfTexture(text) {
      const size = 1024;
      const maxDistance = 192;
      const pixels = new Uint8Array(size * size * 4);
      pixels.fill(255);
      const texture = new THREE.DataTexture(pixels, size, size, THREE.RGBAFormat);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = false;
      texture.flipY = true;
      texture.needsUpdate = true;

      document.fonts.ready.then(() => {
        enqueueSdfJob(() => {
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const context = canvas.getContext('2d', { willReadFrequently: true });
          context.fillStyle = '#fff';
          context.textAlign = 'center';
          context.textBaseline = 'middle';
          context.font = '600 184px "Familjen Grotesk", "DM Sans", sans-serif';
          const safeWidth = size * .84;
          const measuredWidth = context.measureText(text).width;
          if (measuredWidth > safeWidth) {
            context.font = `600 ${Math.floor(184 * safeWidth / measuredWidth)}px "Familjen Grotesk", "DM Sans", sans-serif`;
          }
          context.fillText(text, size / 2, size / 2);

          const rgba = context.getImageData(0, 0, size, size).data;
          const inside = new Uint8Array(size * size);
          for (let index = 0; index < inside.length; index += 1) {
            inside[index] = rgba[index * 4 + 3] > 96 ? 1 : 0;
          }
          const toInside = distanceTransform(inside, size, 1);
          const toOutside = distanceTransform(inside, size, 0);
          for (let index = 0; index < inside.length; index += 1) {
            const signed = inside[index] ? -toOutside[index] : toInside[index];
            const encoded = Math.round((Math.max(-maxDistance, Math.min(maxDistance, signed)) / maxDistance * .5 + .5) * 255);
            const pixel = index * 4;
            pixels[pixel] = encoded;
            pixels[pixel + 1] = encoded;
            pixels[pixel + 2] = encoded;
            pixels[pixel + 3] = 255;
          }
          texture.needsUpdate = true;
        });
      });

      return texture;
    }

    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      uniform vec2 uResolution;
      uniform float uProgress;
      uniform float uVelocity;
      uniform vec2 uPointer;
      uniform float uVideoAspect;
      uniform sampler2D uVideo;
      uniform sampler2D uMask;
      varying vec2 vUv;

      float roundedBox(vec2 point, vec2 size, float radius) {
        vec2 q = abs(point) - size + radius;
        return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - radius;
      }

      void main() {
        float p = smoothstep(.04, .96, uProgress);
        vec2 point = vUv - .5;
        point.y += sin(vUv.x * 3.14159265) * uVelocity * .028;
        point.x += cos(vUv.y * 6.2831853) * uVelocity * .014;

        float liquidPhase = sin(p * 3.14159265);
        vec2 maskUv = vUv;
        maskUv.x += (
          sin(vUv.y * 18.0 + p * 8.0) +
          sin((vUv.x + vUv.y) * 29.0 - p * 5.0) * .45
        ) * .013 * liquidPhase;
        maskUv.y += (
          sin(vUv.x * 15.0 - p * 7.0) +
          cos((vUv.x - vUv.y) * 24.0 + p * 6.0) * .40
        ) * .012 * liquidPhase;

        float squareDistance = roundedBox(point, vec2(.46), .035);
        float maskBounds = step(0.0, maskUv.x) * step(maskUv.x, 1.0) * step(0.0, maskUv.y) * step(maskUv.y, 1.0);
        float maskDistance = (texture2D(uMask, clamp(maskUv, 0.0, 1.0)).r - .5) * .44;
        maskDistance = mix(.22, maskDistance, maskBounds);
        maskDistance += (
          sin((maskUv.x + maskUv.y) * 31.0 + p * 10.0) +
          sin(maskUv.y * 43.0 - p * 8.0)
        ) * .0065 * liquidPhase;

        float distance = mix(squareDistance, maskDistance, p) - liquidPhase * .010;
        float edgeSoftness = max(fwidth(distance), 1.15 / min(uResolution.x, uResolution.y));
        float alpha = 1.0 - smoothstep(-edgeSoftness, edgeSoftness, distance);
        vec2 distanceGradient = vec2(dFdx(distance), dFdy(distance));
        vec2 surfaceNormal = distanceGradient / max(length(distanceGradient), .00001);
        float edgeDepth = clamp(-distance / .035, 0.0, 1.0);
        float glassLip = (1.0 - smoothstep(.05, 1.0, edgeDepth)) * liquidPhase;

        vec2 videoUv = vUv;
        if (uVideoAspect > 1.0) {
          videoUv.x = (videoUv.x - .5) / uVideoAspect + .5;
        } else {
          videoUv.y = (videoUv.y - .5) * uVideoAspect + .5;
        }
        videoUv = videoUv - uPointer * .018;
        vec2 refractedUv = videoUv + surfaceNormal * glassLip * (.011 + abs(uVelocity) * .006);
        vec2 fringe = surfaceNormal * glassLip * .0022;
        vec2 safeUv = clamp(refractedUv, 0.0, 1.0);
        vec3 centerColor = texture2D(uVideo, safeUv).rgb;
        vec3 color = vec3(
          texture2D(uVideo, clamp(safeUv + fringe, 0.0, 1.0)).r,
          centerColor.g,
          texture2D(uVideo, clamp(safeUv - fringe, 0.0, 1.0)).b
        );
        color += vec3(.92, 1.0, .96) * glassLip * .16;
        gl_FragColor = vec4(color, alpha);
      }
    `;

    function createDemo([key]) {
      const section = document.getElementById(`shape-${key}`);
      const frame = document.getElementById(`frame-${key}`);
      let canvas = document.getElementById(`canvas-${key}`);
      let renderer = null;
      let frameSize = 0;
      let releaseTimer = 0;
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const maskTexture = key === 'signature'
        ? createWordmarkSdfTexture('Olawale Balo')
        : createSdfTexture(`assets/images/${key}.svg`);
      const material = new THREE.ShaderMaterial({
        transparent: true,
        extensions: { derivatives: true },
        vertexShader,
        fragmentShader,
        uniforms: {
          uResolution: { value: new THREE.Vector2(512, 512) },
          uProgress: { value: prefersReducedMotion ? 1 : 0 },
          uVelocity: { value: 0 },
          uPointer: { value: new THREE.Vector2() },
          uVideoAspect: { value: 16 / 9 },
          uVideo: { value: sharedVideoTexture },
          uMask: { value: maskTexture }
        }
      });
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));

      const syncVideoAspect = () => {
        material.uniforms.uVideoAspect.value = sharedVideo.videoWidth / sharedVideo.videoHeight;
      };
      if (sharedVideo.readyState >= sharedVideo.HAVE_METADATA) syncVideoAspect();
      else sharedVideo.addEventListener('loadedmetadata', syncVideoAspect, { once: true });

      let visible = false;
      let rawVelocity = 0;
      let smoothVelocity = 0;
      const pointer = { x: 0, y: 0, tx: 0, ty: 0 };

      function ensureRenderer() {
        clearTimeout(releaseTimer);
        if (renderer) return;
        renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        if (frameSize) renderer.setSize(frameSize, frameSize, false);
      }

      function releaseRenderer() {
        if (!renderer) return;
        renderer.dispose();
        renderer.forceContextLoss();
        renderer = null;
        const freshCanvas = canvas.cloneNode(false);
        canvas.replaceWith(freshCanvas);
        canvas = freshCanvas;
      }

      new ResizeObserver(() => {
        frameSize = frame.clientWidth;
        if (!frameSize) return;
        if (renderer) renderer.setSize(frameSize, frameSize, false);
        material.uniforms.uResolution.value.set(frameSize, frameSize);
      }).observe(frame);

      new IntersectionObserver(([entry]) => {
        visible = entry.isIntersecting;
        if (visible) {
          ensureRenderer();
          visibleDemos.add(key);
        } else {
          visibleDemos.delete(key);
          releaseTimer = setTimeout(releaseRenderer, 900);
        }
        syncSharedVideoPlayback();
      }, { rootMargin: '75% 0px', threshold: .01 }).observe(section);

      if (supportsHover && !prefersReducedMotion) {
        addEventListener('pointermove', (event) => {
          pointer.tx = event.clientX / innerWidth * 2 - 1;
          pointer.ty = -(event.clientY / innerHeight * 2 - 1);
        }, { passive: true });
      }

      if (!prefersReducedMotion) {
        gsap.to(material.uniforms.uProgress, {
          value: 1,
          ease: 'power1.inOut',
          scrollTrigger: {
            trigger: section,
            start: 'top top',
            end: 'bottom bottom',
            scrub: .35,
            onUpdate(self) {
              rawVelocity = self.getVelocity();
            }
          }
        });
      }

      return {
        render() {
          if (!visible || !renderer) return;
          const targetVelocity = Math.max(-1, Math.min(1, rawVelocity / 2200));
          smoothVelocity += (targetVelocity - smoothVelocity) * .08;
          rawVelocity *= .89;
          pointer.x += (pointer.tx - pointer.x) * .05;
          pointer.y += (pointer.ty - pointer.y) * .05;
          material.uniforms.uVelocity.value = smoothVelocity;
          material.uniforms.uPointer.value.set(pointer.x, pointer.y);
          if (sharedVideo.readyState >= sharedVideo.HAVE_CURRENT_DATA) sharedVideoTexture.needsUpdate = true;
          renderer.render(scene, camera);
        }
      };
    }

    const demos = SHAPES.map(createDemo);
    let frameId = 0;
    function render() {
      frameId = requestAnimationFrame(render);
      demos.forEach((demo) => demo.render());
    }
    render();

    if (!prefersReducedMotion) {
      gsap.timeline({ scrollTrigger: { trigger: '#intro', start: 'top top', end: 'bottom bottom', scrub: .6 } })
        .to('.intro-content', { opacity: 0, y: -32, scale: .97, ease: 'none' }, 0)
        .to('.scroll-cue', { opacity: 0, y: 12, ease: 'none' }, 0);
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        cancelAnimationFrame(frameId);
        frameId = 0;
      } else if (!frameId) {
        render();
      }
      syncSharedVideoPlayback();
    });

    ScrollTrigger.refresh();
  </script>
</body>
</html>
