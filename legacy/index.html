<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0c0c" />
  <meta name="description" content="A collection of scroll-driven liquid video and image morphing interactions." />
  <title>Comice Morph</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Familjen+Grotesk:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/libs/soundtrack.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0c0c0c;
      background-image: radial-gradient(
        circle,
        rgba(255, 255, 255, 0.14) 1px,
        transparent 1px
      );
      background-size: 16px 16px;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100svh;
      overflow-x: hidden;
    }

    .scroll-section {
      height: 200svh;
      position: relative;
    }

    .sticky-wrapper {
      position: sticky;
      top: 0;
      height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .canvas-container {
      width: min(1224px, calc(100vw - 48px));
      height: auto;
      aspect-ratio: 1224 / 688;
      max-height: 86svh;
      position: relative;
      top: 36px;
      will-change: transform;
      z-index: 1;
    }

    .demo-copy {
      position: absolute;
      z-index: 2;
      top: 64px;
      left: 50%;
      width: min(680px, calc(100vw - 64px));
      transform: translateX(-50%);
      color: #f4f4f4;
      text-align: center;
      pointer-events: none;
    }

    .demo-number,
    .demo-description {
      color: #686868;
      font-family: "IBM Plex Mono", monospace;
      font-weight: 500;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .demo-number { font-size: 9px; }

    .demo-copy h3 {
      margin-top: 5px;
      font-family: "Familjen Grotesk", "DM Sans", sans-serif;
      font-size: 48px;
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.035em;
    }

    .demo-description {
      margin-top: 10px;
      font-size: 12px;
      line-height: 1.45;
    }

    .intro-section {
      position: relative;
      height: 135svh;
    }

    .intro-stage {
      position: sticky;
      top: 0;
      display: grid;
      height: 100svh;
      place-items: center;
      padding: 48px;
      overflow: hidden;
    }

    .intro-content {
      width: min(920px, 100%);
      color: #f4f4f4;
      text-align: center;
      will-change: transform, opacity;
    }

    .intro-kicker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
      color: #878787;
      font-family: "IBM Plex Mono", monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .intro-kicker::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00C65C;
      box-shadow: 0 0 18px rgba(0, 198, 92, 0.7);
      content: "";
    }

    .intro-content h1 {
      font-family: "Familjen Grotesk", "DM Sans", sans-serif;
      font-size: clamp(52px, 7.4vw, 104px);
      font-weight: 600;
      line-height: 0.94;
      letter-spacing: -0.055em;
    }

    .intro-description {
      width: min(610px, 100%);
      margin: 26px auto 0;
      color: #8b8b8b;
      font-size: 16px;
      line-height: 1.6;
    }

    .intro-scroll {
      position: absolute;
      bottom: 28px;
      left: 50%;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #737373;
      font-family: "IBM Plex Mono", monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transform: translateX(-50%);
    }

    .intro-scroll svg {
      width: 15px;
      height: 15px;
      stroke: #00C65C;
      stroke-width: 1.6;
      fill: none;
      animation: intro-arrow 1.8s ease-in-out infinite;
    }

    @keyframes intro-arrow {
      0%, 100% { transform: translateY(-2px); }
      50% { transform: translateY(3px); }
    }

    @media (max-width: 900px) {
      .intro-stage { padding-inline: 32px; }
      .intro-scroll { left: 50%; }

      .sticky-wrapper {
        padding-inline: 24px;
      }

      .canvas-container {
        width: min(calc(100vw - 48px), calc(78svh * 1.779));
        max-height: none;
      }

      .demo-copy {
        left: 50%;
        width: min(620px, calc(100vw - 64px));
      }
    }

    @media (max-width: 600px) {
      .scroll-section { height: 180svh; }
      .intro-section { height: 125svh; }
      .intro-stage { padding-inline: 24px; }
      .intro-content h1 { font-size: clamp(44px, 14vw, 62px); }
      .intro-description { margin-top: 20px; font-size: 14px; }
      .intro-kicker { margin-bottom: 16px; font-size: 9px; }
      .intro-scroll { bottom: 22px; }
      .sticky-wrapper {
        padding-inline: 12px;
      }

      .canvas-container {
        top: 24px;
        width: min(calc(100vw - 24px), calc(68svh * 1.779));
      }

      .demo-copy {
        top: 54px;
        width: calc(100vw - 48px);
      }

      .demo-copy h3 { font-size: 28px; }
      .demo-number { font-size: 9px; }
      .demo-description { font-size: 12px; line-height: 1.45; }
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .media-source {
      display: none;
    }

  </style>
</head>
<body>

  <section class="scroll-section" id="archSection"><div class="sticky-wrapper"><div class="canvas-container" id="archCanvasWrapper"><canvas id="archCanvas"></canvas></div></div></section>

  <video class="media-source" id="radialFanVideoSource" preload="metadata" playsinline webkit-playsinline muted loop></video>
  <video class="media-source" id="cardDeckVideoSource" preload="metadata" playsinline webkit-playsinline muted loop></video>
  <video class="media-source" id="petalVideoSource" preload="metadata" playsinline webkit-playsinline muted loop></video>
  <video class="media-source" id="filmVideoSource" preload="metadata" playsinline webkit-playsinline muted loop></video>
  <video class="media-source" id="ringsVideoSource" preload="metadata" playsinline webkit-playsinline muted loop></video>
  <video class="media-source" id="waveVideoSource" preload="metadata" playsinline webkit-playsinline muted loop></video>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="assets/libs/soundtrack.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);

    const isHoverSupported = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    const GAP_PX = 24;

    const DEMOS = [
      {
        sectionId: 'originalVideoSection',
        containerId: 'originalVideoCanvasWrapper',
        canvasId: 'originalVideoCanvas',
        mediaType: 'video',
        mediaUrl: 'assets/video/canvas.mp4',
        videoId: 'originalVideoSource',
        layout: 'gallery',
        cardCount: 3,
        direction: 'split-to-full',
        enableScale: true,
        enableBend: true,
        enableLiquid: true,
        enableCursorFollow: true,
        startScale: 0.90,
        endScale: 1.00,
        scrollStart: 'top top',
        scrollEnd: 'bottom bottom'
      },
      {
        sectionId: 'originalImageSection',
        containerId: 'originalImageCanvasWrapper',
        canvasId: 'originalImageCanvas',
        mediaType: 'video',
        mediaUrl: 'assets/video/bg.mp4',
        videoId: 'trioBreakoutVideoSource',
        layout: 'gallery',
        cardCount: 3,
        direction: 'full-to-split',
        enableScale: true,
        enableBend: true,
        enableLiquid: true,
        enableCursorFollow: true,
        startScale: 0.90,
        endScale: 1.00,
        scrollStart: 'top top',
        scrollEnd: 'bottom bottom'
      },
      {
        sectionId: 'circleSection',
        containerId: 'circleCanvasWrapper',
        canvasId: 'circleCanvas',
        mediaType: 'video',
        mediaUrl: 'assets/video/bg.mp4',
        videoId: 'circleVideoSource',
        layout: 'circles',
        direction: 'full-to-split',
        enableScale: true,
        enableBend: true,
        enableLiquid: true,
        enableCursorFollow: true,
        startScale: 0.86,
        endScale: 1.00,
        scrollStart: 'top top',
        scrollEnd: 'bottom bottom'
      },
      {
        sectionId: 'gameSymbolsSection',
        containerId: 'gameSymbolsCanvasWrapper',
        canvasId: 'gameSymbolsCanvas',
        mediaType: 'video',
        mediaUrl: 'assets/video/bg.mp4',
        videoId: 'gameSymbolsVideoSource',
        layout: 'gameSymbols',
        direction: 'full-to-split',
        enableScale: true,
        enableBend: true,
        enableLiquid: true,
        enableCursorFollow: true,
        startScale: 0.90,
        endScale: 1.00,
        scrollStart: 'top top',
        scrollEnd: 'bottom bottom'
      },
      {
        sectionId: 'appleLogoSection', containerId: 'appleLogoCanvasWrapper', canvasId: 'appleLogoCanvas',
        mediaType: 'video', mediaUrl: 'assets/video/bg.mp4', videoId: 'appleLogoVideoSource', layout: 'appleLogo',
        maskUrl: 'assets/images/apple.svg', maskScale: 0.84, liquidSheen: 0.22,
        direction: 'full-to-split', enableScale: true, enableBend: true, enableLiquid: true, enableCursorFollow: true,
        startScale: 0.88, endScale: 1.00, scrollStart: 'top top', scrollEnd: 'bottom bottom'
      },
      {
        sectionId: 'archSection', containerId: 'archCanvasWrapper', canvasId: 'archCanvas',
        mediaType: 'video', mediaUrl: 'assets/video/bg.mp4', videoId: 'archVideoSource', layout: 'arches',
        direction: 'full-to-split', enableScale: true, enableBend: true, enableLiquid: true, enableCursorFollow: true,
        startScale: 0.88, endScale: 1.00, scrollStart: 'top top', scrollEnd: 'bottom bottom'
      },
      {
        sectionId: 'radialFanSection', containerId: 'radialFanCanvasWrapper', canvasId: 'radialFanCanvas',
        mediaType: 'video', mediaUrl: 'assets/video/bg.mp4', videoId: 'radialFanVideoSource', layout: 'radialFan',
        direction: 'full-to-split', enableScale: true, enableBend: true, enableLiquid: true, enableCursorFollow: true,
        startScale: 0.86, endScale: 1.00, scrollStart: 'top top', scrollEnd: 'bottom bottom'
      },
      {
        sectionId: 'cardDeckSection', containerId: 'cardDeckCanvasWrapper', canvasId: 'cardDeckCanvas',
        mediaType: 'video', mediaUrl: 'assets/video/bg.mp4', videoId: 'cardDeckVideoSource', layout: 'cardDeck',
        direction: 'full-to-split', enableScale: true, enableBend: true, enableLiquid: true, enableCursorFollow: true,
        startScale: 0.86, endScale: 1.00, scrollStart: 'top top', scrollEnd: 'bottom bottom'
      },
      {
        sectionId: 'petalSection', containerId: 'petalCanvasWrapper', canvasId: 'petalCanvas',
        mediaType: 'video', mediaUrl: 'assets/video/bg.mp4', videoId: 'petalVideoSource', layout: 'petals',
        direction: 'full-to-split', enableScale: true, enableBend: true, enableLiquid: true, enableCursorFollow: true,
        startScale: 0.88, endScale: 1.00, scrollStart: 'top top', scrollEnd: 'bottom bottom'
      },
      {
        sectionId: 'filmSection', containerId: 'filmCanvasWrapper', canvasId: 'filmCanvas',
        mediaType: 'video', mediaUrl: 'assets/video/bg.mp4', videoId: 'filmVideoSource', layout: 'filmStrip',
        direction: 'full-to-split', enableScale: true, enableBend: true, enableLiquid: true, enableCursorFollow: true,
        startScale: 0.88, endScale: 1.00, scrollStart: 'top top', scrollEnd: 'bottom bottom'
      },
      {
        sectionId: 'ringsSection', containerId: 'ringsCanvasWrapper', canvasId: 'ringsCanvas',
        mediaType: 'video', mediaUrl: 'assets/video/bg.mp4', videoId: 'ringsVideoSource', layout: 'audioSpectrum',
        direction: 'full-to-split', enableScale: true, enableBend: true, enableLiquid: true, enableCursorFollow: true,
        startScale: 0.90, endScale: 1.00, scrollStart: 'top top', scrollEnd: 'bottom bottom'
      },
      {
        sectionId: 'waveSection', containerId: 'waveCanvasWrapper', canvasId: 'waveCanvas',
        mediaType: 'video', mediaUrl: 'assets/video/canvas.mp4', videoId: 'waveVideoSource', layout: 'waveTiles',
        direction: 'split-to-full', finalShape: 'wordmark', wordmark: 'Olawale Balo', enableScale: true, enableBend: true, enableLiquid: true, enableCursorFollow: true,
        finalBlendStart: 0.68, finalBlendEnd: 0.98,
        startScale: 0.90, endScale: 1.00, scrollStart: 'top top', scrollEnd: 'bottom bottom'
      }
    ];

    const DEMO_ORDER = [
      'originalVideoSection',
      'radialFanSection',
      'cardDeckSection',
      'circleSection',
      'gameSymbolsSection',
      'appleLogoSection',
      'archSection',
      'petalSection',
      'filmSection',
      'ringsSection',
      'originalImageSection',
      'waveSection'
    ];
    DEMOS.sort((a, b) => DEMO_ORDER.indexOf(a.sectionId) - DEMO_ORDER.indexOf(b.sectionId));

    function buildShapeShader(config) {
      const combine = config.enableLiquid ? 'smin' : 'min';
      const combineCall = (current, next) => config.enableLiquid
        ? `${combine}(${current}, ${next}, blendK)`
        : `${combine}(${current}, ${next})`;

      if (config.layout === 'circles') {
        const positions = [
          [-0.68, 0.08],
          [-0.34, -0.08],
          [0.0, 0.08],
          [0.34, -0.08],
          [0.68, 0.08]
        ];
        const declarations = positions.map(([x, y], index) => `
          vec2 circleCenter${index} = mix(vec2(${x.toFixed(2)}, ${y.toFixed(2)}), vec2(0.0), pMerge);
          float dShape${index} = length(st - circleCenter${index}) - mix(0.16, 0.58, pMerge);
        `).join('');
        const union = positions.slice(1).reduce(
          (current, _, index) => combineCall(current, `dShape${index + 1}`),
          'dShape0'
        );
        return `${declarations}\nfloat dShapes = ${union};`;
      }

      if (config.layout === 'gameSymbols') {
        return `
          float symbolScale = mix(0.16, 0.58, pMerge);
          vec2 squareCenter = mix(vec2(-0.66, 0.0), vec2(0.0), pMerge);
          vec2 triangleCenter = mix(vec2(-0.22, 0.0), vec2(0.0), pMerge);
          vec2 circleCenter = mix(vec2(0.22, 0.0), vec2(0.0), pMerge);
          vec2 crossCenter = mix(vec2(0.66, 0.0), vec2(0.0), pMerge);

          float dShape0 = sdRoundedBox(st - squareCenter, vec2(symbolScale), mix(0.035, 0.055, pMerge));
          vec2 trianglePoint = st - triangleCenter;
          float triangleBottom = -trianglePoint.y - symbolScale;
          float triangleSides = trianglePoint.y + 2.0 * abs(trianglePoint.x) - symbolScale;
          float dShape1 = max(triangleBottom, triangleSides);
          float dShape2 = length(st - circleCenter) - symbolScale;

          vec2 crossPoint = st - crossCenter;
          crossPoint = mat2(0.7071068, -0.7071068, 0.7071068, 0.7071068) * crossPoint;
          float crossWidth = mix(0.065, 0.24, pMerge);
          float crossLength = 1.4142136 * symbolScale - crossWidth + mix(0.007, 0.0, pMerge);
          float dCrossV = sdRoundedBox(crossPoint, vec2(crossWidth, crossLength), crossWidth * 0.38);
          float dCrossH = sdRoundedBox(crossPoint, vec2(crossLength, crossWidth), crossWidth * 0.38);
          float dShape3 = min(dCrossV, dCrossH);

          float dShapes = ${combineCall(combineCall(combineCall('dShape0', 'dShape1'), 'dShape2'), 'dShape3')};
        `;
      }

      if (config.layout === 'appleLogo') {
        return `
          vec2 appleUv = st / ${Number(config.maskScale ?? 0.92).toFixed(2)} + 0.5;
          float appleBounds = step(0.0, appleUv.x) * step(appleUv.x, 1.0)
            * step(0.0, appleUv.y) * step(appleUv.y, 1.0);
          float appleSdf = texture2D(u_wordmark, appleUv).r;
          float dApple = (appleSdf - 0.5) * 0.345;
          dApple = mix(0.18, dApple, appleBounds);
          float logoLiquidPhase = sin(pMerge * 3.14159265);
          float logoRipple = (
            sin(appleUv.y * 28.0 + p * 9.0)
            + sin(appleUv.x * 23.0 - p * 7.0)
          ) * 0.0025 * logoLiquidPhase;
          dApple += logoRipple * appleBounds;
          float frameContract = smoothstep(0.55, 0.92, pMerge);
          vec2 frameSize = mix(vec2(0.47, 0.44), vec2(0.89, 0.50), frameContract);
          float frameRadius = mix(0.18, 0.045, frameContract);
          float dFrame = sdRoundedBox(st, frameSize, frameRadius);
          float contourBlend = smoothstep(0.45, 0.70, pMerge);
          float dShapes = mix(dApple, dFrame, contourBlend);
        `;
      }

      if (config.layout === 'arches') {
        const archHalfWidth = 0.22;
        const archPitch = archHalfWidth * 2 + GAP_PX / 688;
        return `
          vec2 archSize = mix(vec2(${archHalfWidth.toFixed(2)}, 0.40), vec2(0.62, 0.46), pMerge);
          vec2 archCenter0 = mix(vec2(${(-archPitch).toFixed(4)}, 0.0), vec2(0.0), pMerge);
          vec2 archCenter1 = vec2(0.0);
          vec2 archCenter2 = mix(vec2(${archPitch.toFixed(4)}, 0.0), vec2(0.0), pMerge);
          float dShape0 = sdArch(st - archCenter0, archSize);
          float dShape1 = sdArch(st - archCenter1, archSize);
          float dShape2 = sdArch(st - archCenter2, archSize);
          float dShapes = ${combineCall(combineCall('dShape0', 'dShape1'), 'dShape2')};
        `;
      }

      if (config.layout === 'radialFan') {
        const cards = [
          [-0.54, -0.10, 1.28],
          [-0.43, 0.10, 0.86],
          [-0.25, 0.25, 0.43],
          [0.00, 0.30, 0.00],
          [0.25, 0.25, -0.43],
          [0.43, 0.10, -0.86],
          [0.54, -0.10, -1.28]
        ];
        const declarations = cards.map(([x, y, angle], index) => `
          vec2 fanCenter${index} = mix(vec2(${x.toFixed(2)}, ${y.toFixed(2)}), vec2(0.0), pMerge);
          vec2 fanPoint${index} = rotate2d(${angle.toFixed(2)} * (1.0 - pMerge)) * (st - fanCenter${index});
          vec2 fanSize${index} = mix(vec2(0.072, 0.15), vec2(0.58, 0.42), pMerge);
          float dShape${index} = sdRoundedBox(fanPoint${index}, fanSize${index}, mix(0.026, 0.045, pMerge));
        `).join('');
        const union = cards.slice(1).reduce(
          (current, _, index) => combineCall(current, `dShape${index + 1}`),
          'dShape0'
        );
        return `${declarations}\nfloat dShapes = ${union};`;
      }

      if (config.layout === 'cardDeck') {
        const deckHalfWidth = 0.09;
        const deckPitch = deckHalfWidth * 2 + GAP_PX / 688;
        const cards = Array.from({ length: 6 }, (_, index) => [
          (index - 2.5) * deckPitch,
          0,
          index === 0 ? 0 : 0.18
        ]);
        const declarations = cards.map(([x, y, angle], index) => `
          vec2 deckCenter${index} = mix(vec2(${x.toFixed(2)}, ${y.toFixed(2)}), vec2(0.0), pMerge);
          vec2 deckPoint${index} = rotate2d(${angle.toFixed(2)} * (1.0 - pMerge)) * (st - deckCenter${index});

          float dShape${index} = sdRoundedBox(deckPoint${index}, deckSize${index}, mix(0.035, 0.045, pMerge));

        const union = cards.slice(1).reduce(

          vec2 petalPoint${index} = rotate2d(${angle.toFixed(4)}) * (st - petalCenter${index});
          float dShape${index} = sdEllipseApprox(petalPoint${index}, mix(vec2(0.115, 0.23), vec2(0.58, 0.44), pMerge));

        const union = petals.slice(1).reduce((current, _, index) => combineCall(current, `dShape${index + 1}`), 'dShape0');

      if (config.layout === 'filmStrip') {

        const declarations = frames.map(([x, y, angle], index) => `

          vec2 waveSize${index} = mix(vec2(0.16, 0.30), vec2(0.58, 0.42), pMerge);

      const declarations = Array.from({ length: count }, (_, index) => {

            cardRadius

      }).join('');
      const union = Array.from({ length: count - 1 }, (_, index) => index + 1).reduce(
        (current, index) => combineCall(current, `dShape${index}`),
        'dShape0'

      return `

        float cardWidth = mix(${startWidth.toFixed(6)}, ${(totalWidth / count).toFixed(6)}, pMerge);

    const emptyMaskTexture = new THREE.DataTexture(
      new Uint8Array([0, 0, 0, 0]),
      1,
      1,
      THREE.RGBAFormat
    );
    emptyMaskTexture.needsUpdate = true;

    function createWordmarkTexture(text) {
      if (!text) return emptyMaskTexture;

      const width = 1024;
      const height = 576;
      const maxDistance = 96;
      const pixels = new Uint8Array(width * height * 4);
      pixels.fill(255);
      const wordmarkTexture = new THREE.DataTexture(pixels, width, height, THREE.RGBAFormat);
      wordmarkTexture.minFilter = THREE.LinearFilter;
      wordmarkTexture.magFilter = THREE.LinearFilter;
      wordmarkTexture.generateMipmaps = false;
      wordmarkTexture.flipY = true;
      wordmarkTexture.needsUpdate = true;

      const wordmarkCanvas = document.createElement('canvas');
      wordmarkCanvas.width = width;
      wordmarkCanvas.height = height;
      const context = wordmarkCanvas.getContext('2d', { willReadFrequently: true });

      const distanceTransform = (inside, targetValue) => {
        const distances = new Float32Array(width * height);
        const infinity = 1e6;
        const diagonal = Math.SQRT2;
        for (let index = 0; index < distances.length; index += 1) {
          distances[index] = inside[index] === targetValue ? 0 : infinity;
        }
        for (let y = 0; y < height; y += 1) {
          for (let x = 0; x < width; x += 1) {
            const index = y * width + x;
            let value = distances[index];
            if (x) value = Math.min(value, distances[index - 1] + 1);
            if (y) value = Math.min(value, distances[index - width] + 1);
            if (x && y) value = Math.min(value, distances[index - width - 1] + diagonal);
            if (x + 1 < width && y) value = Math.min(value, distances[index - width + 1] + diagonal);
            distances[index] = value;
          }
        }
        for (let y = height - 1; y >= 0; y -= 1) {
          for (let x = width - 1; x >= 0; x -= 1) {
            const index = y * width + x;
            let value = distances[index];
            if (x + 1 < width) value = Math.min(value, distances[index + 1] + 1);
            if (y + 1 < height) value = Math.min(value, distances[index + width] + 1);
            if (x + 1 < width && y + 1 < height) value = Math.min(value, distances[index + width + 1] + diagonal);
            if (x && y + 1 < height) value = Math.min(value, distances[index + width - 1] + diagonal);
            distances[index] = value;
          }
        }
        return distances;
      };

      const buildWordmarkSdf = () => {
        context.clearRect(0, 0, width, height);
        context.fillStyle = '#ffffff';
        context.textAlign = 'center';
        context.textBaseline = 'middle';
        context.font = '600 152px "Familjen Grotesk", "DM Sans", sans-serif';

        const safeWidth = width * 0.78;
        const measuredWidth = context.measureText(text).width;
        if (measuredWidth > safeWidth) {
          const fittedSize = Math.floor(152 * safeWidth / measuredWidth);
          context.font = `600 ${fittedSize}px "Familjen Grotesk", "DM Sans", sans-serif`;
        }

        context.fillText(text, width / 2, height / 2);
        const rgba = context.getImageData(0, 0, width, height).data;
        const inside = new Uint8Array(width * height);
        for (let index = 0; index < inside.length; index += 1) {
          inside[index] = rgba[index * 4 + 3] > 96 ? 1 : 0;
        }
        const toInside = distanceTransform(inside, 1);
        const toOutside = distanceTransform(inside, 0);
        for (let index = 0; index < inside.length; index += 1) {
          const signed = inside[index] ? -toOutside[index] : toInside[index];
          const encoded = Math.round((Math.max(-maxDistance, Math.min(maxDistance, signed)) / maxDistance * .5 + .5) * 255);
          const pixel = index * 4;
          pixels[pixel] = encoded;
          pixels[pixel + 1] = encoded;
          pixels[pixel + 2] = encoded;
          pixels[pixel + 3] = 255;
        }
        wordmarkTexture.needsUpdate = true;
      };

      document.fonts.ready.then(() => {
        requestAnimationFrame(buildWordmarkSdf);
      });

      return wordmarkTexture;
    }

    function createAppleLogoTexture() {
      const size = 1024;
      const maxDistance = 192;
      const logoCanvas = document.createElement('canvas');
      logoCanvas.width = size;
      logoCanvas.height = size;
      const context = logoCanvas.getContext('2d');
      const applePath = new Path2D(
        'M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701'
      );

      context.clearRect(0, 0, size, size);
      const logoPadding = size * 0.11;
      const logoScale = (size - logoPadding * 2) / 24;
      context.translate(logoPadding, logoPadding);
      context.scale(logoScale, logoScale);
      context.fillStyle = '#ffffff';
      context.fill(applePath);

      const alpha = context.getImageData(0, 0, size, size).data;
      const inside = new Uint8Array(size * size);
      for (let index = 0; index < inside.length; index += 1) {
        inside[index] = alpha[index * 4 + 3] >= 128 ? 1 : 0;
      }

      const distanceTransform = (targetValue) => {
        const distances = new Float32Array(size * size);
        const infinity = 1e6;
        const diagonal = Math.SQRT2;

        for (let index = 0; index < distances.length; index += 1) {
          distances[index] = inside[index] === targetValue ? 0 : infinity;
        }

        for (let y = 0; y < size; y += 1) {
          for (let x = 0; x < size; x += 1) {
            const index = y * size + x;
            let distance = distances[index];
            if (x > 0) distance = Math.min(distance, distances[index - 1] + 1);
            if (y > 0) distance = Math.min(distance, distances[index - size] + 1);
            if (x > 0 && y > 0) distance = Math.min(distance, distances[index - size - 1] + diagonal);
            if (x + 1 < size && y > 0) distance = Math.min(distance, distances[index - size + 1] + diagonal);
            distances[index] = distance;
          }
        }

        for (let y = size - 1; y >= 0; y -= 1) {
          for (let x = size - 1; x >= 0; x -= 1) {
            const index = y * size + x;
            let distance = distances[index];
            if (x + 1 < size) distance = Math.min(distance, distances[index + 1] + 1);
            if (y + 1 < size) distance = Math.min(distance, distances[index + size] + 1);
            if (x + 1 < size && y + 1 < size) distance = Math.min(distance, distances[index + size + 1] + diagonal);
            if (x > 0 && y + 1 < size) distance = Math.min(distance, distances[index + size - 1] + diagonal);
            distances[index] = distance;
          }
        }

        return distances;
      };

      const distanceToInside = distanceTransform(1);
      const distanceToOutside = distanceTransform(0);
      const sdfPixels = new Uint8Array(size * size * 4);

      for (let index = 0; index < inside.length; index += 1) {
        const signedDistance = inside[index]
          ? -distanceToOutside[index]
          : distanceToInside[index];
        const encoded = Math.round(
          (Math.max(-maxDistance, Math.min(maxDistance, signedDistance)) / maxDistance * 0.5 + 0.5) * 255
        );
        const pixelIndex = index * 4;
        sdfPixels[pixelIndex] = encoded;
        sdfPixels[pixelIndex + 1] = encoded;
        sdfPixels[pixelIndex + 2] = encoded;
        sdfPixels[pixelIndex + 3] = 255;
      }

      const logoTexture = new THREE.DataTexture(sdfPixels, size, size, THREE.RGBAFormat);
      logoTexture.minFilter = THREE.LinearFilter;
      logoTexture.magFilter = THREE.LinearFilter;
      logoTexture.generateMipmaps = false;
      logoTexture.flipY = true;
      logoTexture.needsUpdate = true;
      return logoTexture;
    }

    function createLiquidDemo(config) {
      const section = document.getElementById(config.sectionId);
      const container = document.getElementById(config.containerId);
      const canvas = document.getElementById(config.canvasId);
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      const mouse = { targetX: 0, targetY: 0, currentX: 0, currentY: 0 };

      let rawScrollVelocity = 0;
      let smoothVelocity = 0;
      let isVisible = false;
      let media;
      let texture;

      if (config.mediaType === 'image') {
        texture = new THREE.TextureLoader().load(config.mediaUrl, (loadedTexture) => {
          const { width, height } = loadedTexture.image;
          material.uniforms.u_mediaAspect.value = width / height;
        });
      } else {
        media = document.getElementById(config.videoId);
        media.src = config.mediaUrl;
        media.addEventListener('loadedmetadata', () => {
          material.uniforms.u_mediaAspect.value = media.videoWidth / media.videoHeight;
        });
        texture = new THREE.VideoTexture(media);
      }

      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      const wordmarkTexture = config.layout === 'appleLogo'
        ? createAppleLogoTexture()
        : createWordmarkTexture(config.wordmark);
      wordmarkTexture.minFilter = THREE.LinearFilter;
      wordmarkTexture.magFilter = THREE.LinearFilter;
      wordmarkTexture.generateMipmaps = false;
      const shapeShader = buildShapeShader(config);

      const fragmentShader = `
      uniform vec2 u_resolution;
      uniform float u_progress;
      uniform vec2 u_mouse;
      uniform float u_velocity;
      uniform float u_mediaAspect;
      uniform sampler2D u_media;
      uniform sampler2D u_wordmark;

      varying vec2 vUv;

      float smin(float a, float b, float k) {
        float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
        return mix(b, a, h) - k * h * (1.0 - h);
      }

      float sdRoundedBox(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + vec2(r);
        return min(max(q.x, q.y), 0.0) + length(max(q, 0.0)) - r;
      }

      mat2 rotate2d(float angle) {
        float c = cos(angle);
        float s = sin(angle);
        return mat2(c, -s, s, c);
      }

      float sdEllipseApprox(vec2 p, vec2 radius) {
        return (length(p / radius) - 1.0) * min(radius.x, radius.y);
      }

      float sdArch(vec2 p, vec2 size) {
        float body = sdRoundedBox(p - vec2(0.0, -size.y * 0.22), vec2(size.x, size.y * 0.72), 0.025);
        float dome = length(p - vec2(0.0, size.y * 0.48)) - size.x;
        return min(body, dome);
      }


      void main() {
        float aspect = u_resolution.x / u_resolution.y;
        vec2 st = (vUv - 0.5) * vec2(aspect, 1.0);

        float arch = sin(vUv.x * 3.14159265);
        st.y += arch * u_velocity * 0.04;

        float pinch = cos(st.y * 3.14159265 * 2.0);
        st.x += pinch * u_velocity * 0.02;

        float p = clamp(u_progress, 0.0, 1.0);

        float pMerge  = smoothstep(0.10, 0.90, p);
        float pFinal  = smoothstep(
          ${Number(config.finalBlendStart ?? 0.85).toFixed(2)},
          ${Number(config.finalBlendEnd ?? 1.0).toFixed(2)},
          p
        );
        float totalW      = 1224.0 / 688.0;
        float blendK = ${config.enableLiquid ? 'sin(pMerge * 3.14159265) * 0.16 + 0.002' : '0.001'};

        ${shapeShader}

        ${config.finalShape === 'wordmark' ? `
          float wordmarkSdf = texture2D(u_wordmark, vUv).r;
          float dWordmark = (wordmarkSdf - 0.5) * 0.34;
        ` : ''}
        float dFinalShape = ${config.finalShape === 'wordmark'
          ? 'dWordmark'
          : config.finalShape === 'circle'
          ? 'length(st) - 0.50'
          : config.finalShape === 'square'
            ? 'sdRoundedBox(st, vec2(0.50), 0.035)'
            : 'sdRoundedBox(st, vec2(totalW * 0.5, 0.5), 32.0 / 688.0)'};
        float dResult = mix(dShapes, dFinalShape, pFinal);
        float morphEnergy = sin(p * 3.14159265);
        float surfaceTension = (
          sin(st.x * 18.0 + p * 8.0)
          + sin((st.x + st.y) * 27.0 - p * 6.0) * 0.52
          + cos(st.y * 22.0 + p * 7.0) * 0.34
        ) * (0.0028 + abs(u_velocity) * 0.0022) * morphEnergy;
        dResult += surfaceTension;

        float edgeAA = max(fwidth(dResult), 1.15 / min(u_resolution.x, u_resolution.y));
        vec2 fieldGradient = vec2(dFdx(dResult), dFdy(dResult));
        vec2 fieldNormal = fieldGradient / max(length(fieldGradient), 0.00001);
        float edgeDepth = clamp(-dResult / 0.035, 0.0, 1.0);
        float glassLip = (1.0 - smoothstep(0.05, 1.0, edgeDepth)) * morphEnergy;
        float liquidSheen = ${config.enableLiquid
          ? `glassLip * ${Number(config.liquidSheen ?? 0.16).toFixed(2)}`
          : '0.0'};

        float shapeAlpha = 1.0 - smoothstep(-edgeAA, edgeAA, dResult);
        float alpha = shapeAlpha;

        vec2 coverScale = vec2(1.0);
        if (u_mediaAspect > aspect) {
          coverScale.x = aspect / u_mediaAspect;
        } else {
          coverScale.y = u_mediaAspect / aspect;
        }

        ${config.enableCursorFollow ? `
          vec2 mediaOffset = u_mouse * 0.035;
          vec2 centeredUv = (vUv - 0.5) * coverScale * 0.95 + 0.5;
          vec2 parallaxUV = centeredUv - mediaOffset;
        ` : `
          vec2 parallaxUV = (vUv - 0.5) * coverScale + 0.5;
        `}

        vec2 refractedUv = parallaxUV + fieldNormal * glassLip * (0.010 + abs(u_velocity) * 0.006);
        vec2 fringe = fieldNormal * glassLip * 0.0022;
        vec2 safeUv = clamp(refractedUv, 0.0, 1.0);
        vec4 mediaColor = texture2D(u_media, safeUv);
        vec3 refractedColor = vec3(
          texture2D(u_media, clamp(safeUv + fringe, 0.0, 1.0)).r,
          mediaColor.g,
          texture2D(u_media, clamp(safeUv - fringe, 0.0, 1.0)).b
        );
        vec3 finalColor = refractedColor + vec3(0.92, 1.0, 0.96) * liquidSheen;

        gl_FragColor = vec4(finalColor, mediaColor.a * alpha);
      }
      `;

      const vertexShader = `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `;

      const material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        transparent: true,
        extensions: { derivatives: true },
        uniforms: {
          u_resolution: { value: new THREE.Vector2() },
          u_progress: { value: 0.0 },
          u_mouse: { value: new THREE.Vector2(0, 0) },
          u_velocity: { value: 0.0 },
          u_mediaAspect: { value: 16 / 9 },
          u_media: { value: texture },
          u_wordmark: { value: wordmarkTexture }
        }

      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
      scene.add(mesh);

      const resizeObserver = new ResizeObserver(() => {
        const w = container.clientWidth;
        const h = container.clientHeight;
        if (w > 0 && h > 0) {
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
          renderer.setSize(w, h, false);
          material.uniforms.u_resolution.value.set(w, h);
        }
      });
      resizeObserver.observe(container);

      const visibilityObserver = new IntersectionObserver(([entry]) => {
        isVisible = entry.isIntersecting;
        if (media) {
          if (isVisible) {
            media.play().catch(() => {
              document.addEventListener('pointerdown', () => media.play().catch(() => {}), { once: true });
            });
          }
          else media.pause();
        }
      }, { threshold: 0.05 });
      visibilityObserver.observe(section);

      if (config.enableCursorFollow && isHoverSupported && !prefersReducedMotion) {
        window.addEventListener('mousemove', (event) => {
          mouse.targetX = (event.clientX / window.innerWidth) * 2 - 1;
          mouse.targetY = -(event.clientY / window.innerHeight) * 2 + 1;
        });
      }

      function renderFrame() {
        if (!isVisible) return;

        if (config.enableBend && !prefersReducedMotion) {
          const targetVel = Math.max(-1.0, Math.min(1.0, rawScrollVelocity / 2000));
          smoothVelocity += (targetVel - smoothVelocity) * 0.08;
          material.uniforms.u_velocity.value = smoothVelocity;
          rawScrollVelocity *= 0.9;
        }

        if (config.enableCursorFollow && isHoverSupported && !prefersReducedMotion) {
          mouse.currentX += (mouse.targetX - mouse.currentX) * 0.05;
          mouse.currentY += (mouse.targetY - mouse.currentY) * 0.05;
          material.uniforms.u_mouse.value.set(mouse.currentX, mouse.currentY);
        }

        const currentScale = container.dataset.scale || 1.0;
        container.style.transform = `scale(${currentScale})`;

        if (media && media.readyState >= media.HAVE_CURRENT_DATA) {
          texture.needsUpdate = true;
        }
        renderer.render(scene, camera);
      }

      const isFullToSplit = config.direction === 'full-to-split';
      const pStart = isFullToSplit ? 1.0 : 0.0;
      const pEnd = isFullToSplit ? 0.0 : 1.0;
      const sStart = config.enableScale
        ? (isFullToSplit ? config.endScale : config.startScale)
        : 1.0;
      const sEnd = config.enableScale
        ? (isFullToSplit ? config.startScale : config.endScale)
        : 1.0;

      const hasStaticProgress = Number.isFinite(config.staticProgress);
      material.uniforms.u_progress.value = hasStaticProgress
        ? config.staticProgress
        : (prefersReducedMotion ? pEnd : pStart);
      container.dataset.scale = hasStaticProgress
        ? 1.0
        : (prefersReducedMotion ? 1.0 : sStart);

      if (!prefersReducedMotion && !hasStaticProgress) {
        const timeline = gsap.timeline({
          scrollTrigger: {
            trigger: section,
            start: config.scrollStart,
            end: config.scrollEnd,
            scrub: 0.3,
            onUpdate: (self) => {
              if (config.enableBend) rawScrollVelocity = self.getVelocity();
            }
          }
        });

        timeline.to(container, {
          onUpdate: function() {
            const progress = this.progress();
            container.dataset.scale = sStart + (sEnd - sStart) * progress;
          },
          duration: 1,
          ease: 'power1.out'
        }, 0);

        timeline.to(material.uniforms.u_progress, {
          value: pEnd,
          ease: 'power1.inOut',
          duration: 1
        }, 0);
      }

      return {
        config,
        section,
        container,
        renderFrame
      };
    }

    const VARIANT_NAMES = {
      originalVideoSection: 'Hero Merge',
      originalImageSection: 'Hero Breakout',
      circleSection: 'Circle Merge',
      gameSymbolsSection: 'Game Symbols Breakout',
      appleLogoSection: 'Brandmark Reveal',
      archSection: 'Arch Windows',
      radialFanSection: 'Radical Card',
      cardDeckSection: 'Editorial Shelf',
      petalSection: 'Petal Bloom',
      filmSection: 'Film Strip',
      ringsSection: 'Audio Spectrum',
      waveSection: '@walebuilds_'
    };

    const VARIANT_USES = {
      originalVideoSection: 'Hero reveals and cinematic scene transitions',
      originalImageSection: 'Editorial reveals and campaign storytelling',
      circleSection: 'Profile collections, communities and team moments',
      gameSymbolsSection: 'Gaming launches and playful feature campaigns',
      appleLogoSection: 'Logo reveals, brand films and campaign end frames',
      archSection: 'Architecture, interiors and premium editorial',
      radialFanSection: 'Team stories, collections and campaign highlights',
      cardDeckSection: 'Book covers, magazine stories and curated media collections',
      petalSection: 'Beauty, fashion and expressive brand moments',
      filmSection: 'Showreels, trailers and timeline highlights',
      ringsSection: 'Music releases, live sets and audio visualizers',
      waveSection: ''
    };

    const demoInstances = DEMOS.map(createLiquidDemo);

    let animationFrameId = 0;
    function renderAllDemos() {
      animationFrameId = requestAnimationFrame(renderAllDemos);
      demoInstances.forEach((instance) => instance.renderFrame());
    }

    function startRenderLoop() {
      if (!animationFrameId) animationFrameId = requestAnimationFrame(renderAllDemos);
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = 0;
      } else {
        startRenderLoop();
      }
    });

    startRenderLoop();

    demoInstances.forEach((instance, index) => {
      const name = VARIANT_NAMES[instance.config.sectionId];
      const copy = document.createElement('header');
      copy.className = 'demo-copy';
      const usage = VARIANT_USES[instance.config.sectionId];
      copy.innerHTML = `
        <p class="demo-number">${String(index + 1).padStart(2, '0')} / ${demoInstances.length}</p>
        <h3>${name}</h3>
        ${usage ? `<p class="demo-description">${usage}</p>` : ''}
      `;
      instance.section.querySelector('.sticky-wrapper').appendChild(copy);
    });

    if (!prefersReducedMotion) {
      gsap.timeline({
        scrollTrigger: {
          trigger: '#introSection',
          start: 'top top',
          end: 'bottom bottom',
          scrub: 0.6
        }
      })
        .to('.intro-content', { opacity: 0, y: -34, scale: 0.97, ease: 'none' }, 0)
        .to('.intro-scroll', { opacity: 0, y: 12, ease: 'none' }, 0);
    }

    ScrollTrigger.refresh();
  </script>
</body>
</html>
